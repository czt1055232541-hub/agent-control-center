[project]
name = "agent-control-center"
version = "0.5.0"
description = "Local desktop control center for the machine agent stack."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "psutil>=5.9,<8",
    "uvicorn>=0.32,<1",
    "prometheus_client>=0.20,<1",
    "pydantic>=2.10,<3",
    "starlette>=0.41,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
