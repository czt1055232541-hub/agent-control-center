    :root {

      --line: #dbe4ef;
      --text: #172033;
      --muted: #657084;
      --blue: #3b82f6;
      --teal: #14a9a0;
      --green: #32a852;
      --gold: #d29b22;
      --red: #dc4c4c;
      --purple: #8b5cf6;
      --shadow: 0 18px 42px rgba(15, 23, 42, .10);

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(59, 130, 246, .10), transparent 28rem),
        radial-gradient(circle at 88% 8%, rgba(20, 169, 160, .10), transparent 30rem),
        linear-gradient(180deg, #fbfdff, var(--bg));
    }
    button { font: inherit; cursor: pointer; }
    .app { min-height: 100%; padding: 20px; display: grid; gap: 16px; grid-template-rows: auto auto 1fr; }
    .topbar, .panel, .agent-card, .workspace { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .topbar { padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .title h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    .title p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .legend { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; color: var(--muted); font-size: 12px; background: #fff; white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .agents { display: flex; justify-content: center; gap: 14px; padding: 8px 0; }
    .agent-card { width: 72px; padding: 10px; text-align: center; border-width: 1px; transition: .16s ease; min-height: 82px; }
    .agent-card:hover { transform: translateY(-2px); }
    .agent-card.active { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(20, 169, 160, .15), var(--shadow); }
    .agent-head { display: grid; gap: 6px; justify-items: center; }
    .avatar { width: 48px; height: 48px; display: grid; place-items: center; color: #fff; font-weight: 900; border-radius: 50%; flex: 0 0 auto; }
    .agent-card h2 { margin: 0; font-size: 11px; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agent-card p, .mini-stats { display: none; }
    .main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; min-height: 0; }
    .panel { padding: 16px; min-height: 0; }
    .selected { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; }
    .profile h3, .side h3, .inspector h3 { margin: 0 0 10px; font-size: 14px; }
    .profile-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .profile-row label { color: var(--muted); }
    .overview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
    .overview-stat { border: 1px solid var(--line); border-radius: 10px; background: var(--soft); padding: 8px 10px; min-width: 0; }
    .overview-stat label { display: block; color: var(--muted); font-size: 11px; }
    .overview-stat strong { display: block; color: var(--text); font-size: 16px; margin-top: 2px; }
    .preview { position: relative; min-height: 320px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(135deg, #f8fbff, #eef6f5); overflow: hidden; }
    .preview::before, .tree::before {
      content: "";
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(23,32,51,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(23,32,51,.05) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
    }
    .node { position: absolute; transform: translate(-50%, -50%); min-width: 132px; border-radius: 12px; padding: 8px 10px; border: 1px solid var(--line); background: #fff; box-shadow: 0 6px 16px rgba(15,23,42,.08); font-size: 12px; z-index: 2; }
    .node button { all: unset; display: flex; align-items: center; gap: 8px; width: 100%; cursor: pointer; }
    .node-icon { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 12px; flex: 0 0 auto; }
    .node small { display: block; color: var(--muted); margin-top: 1px; }
    .node.future { background: #222937; border-style: dashed; color: #fff; }
    .node.future small { color: #bac4d4; }
    .node.planned { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(20,169,160,.16), 0 6px 16px rgba(15,23,42,.10); }
    .node.equipped { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,.14), 0 6px 16px rgba(15,23,42,.10); }
    .edge { position: absolute; height: 2px; transform-origin: left center; background: rgba(20, 169, 160, .55); z-index: 1; }
    .full-toggle { margin-top: 12px; display: flex; gap: 10px; }
    .btn { border: 0; border-radius: 11px; padding: 10px 13px; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
    .btn.primary { background: #111827; color: #fff; }
    .btn.secondary { background: #fff; color: var(--text); border: 1px solid var(--line); }
    .btn.teal { background: var(--teal); color: #fff; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .side { display: grid; gap: 12px; align-content: start; }
    .roadmap-item, .slot, .skill-row { border: 1px solid var(--line); border-radius: 12px; background: var(--soft); padding: 10px; }
    .roadmap-item { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .roadmap-item strong { font-size: 12px; }
    .roadmap-item span, .slot span, .skill-row span { color: var(--muted); font-size: 11px; }
    .empty { color: var(--muted); font-size: 12px; padding: 16px; border: 1px dashed var(--line); border-radius: 12px; background: var(--soft); }
    .workspace { display: none; padding: 16px; grid-column: 1 / -1; min-height: 680px; }
    .workspace.open { display: grid; grid-template-columns: minmax(0, 1fr) 330px; grid-template-rows: auto 1fr auto; gap: 14px; }
    .workspace-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .workspace-head h2 { margin: 0; font-size: 18px; }
    .workspace-head p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .tree { position: relative; min-height: 540px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(135deg, #fbfdff, #edf6f5); overflow: hidden; cursor: grab; touch-action: none; }
    .tree.dragging { cursor: grabbing; }
    .tree-canvas { position: absolute; inset: 0; min-width: 100%; min-height: 100%; transform: translate(var(--pan-x, 0px), var(--pan-y, 0px)); transform-origin: 0 0; }
    .pan-handle { position: absolute; left: 50%; top: 12px; z-index: 5; transform: translateX(-50%); border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; background: rgba(255,255,255,.9); color: var(--muted); font-size: 12px; font-weight: 800; box-shadow: 0 8px 20px rgba(15,23,42,.08); cursor: grab; }
    .pan-handle:active { cursor: grabbing; }
    .branch-label { position: absolute; top: 86px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.9); font-size: 12px; font-weight: 800; z-index: 6; pointer-events: none; }
    .branch-label.left { left: 14px; }
    .branch-label.right { right: 14px; }
    .divider { position: absolute; left: 50%; top: 54px; bottom: 14px; width: 1px; background: linear-gradient(transparent, #c8d4e2, transparent); }
    .inspector { display: grid; gap: 12px; align-content: start; }
    .inspector-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: #fff; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .slotbar { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .slot strong { display: block; font-size: 12px; margin-bottom: 5px; }
    .skill-list { max-height: 280px; overflow: auto; display: grid; gap: 8px; }
    .config-tools { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .file-label { border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; background: #fff; color: var(--text); font-size: 12px; font-weight: 800; cursor: pointer; }
    .file-label input { display: none; }
    .config-status { width: 100%; text-align: right; color: var(--muted); font-size: 11px; }
    .plan-form { display: grid; gap: 8px; }
    .plan-form input, .plan-form select, .plan-form textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: #fff; color: var(--text); font: inherit; font-size: 12px;
    }
    .plan-form textarea { min-height: 58px; resize: vertical; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 700px) { .overview-grid { grid-template-columns: repeat(2, 1fr); } }
    .real-skill-link { display: block; margin-top: 4px; color: var(--blue); text-decoration: none; overflow-wrap: anywhere; }
    .real-skill-link:hover { text-decoration: underline; }
    .hide { display: none; }
    @media (max-width: 1100px) {
      .agents, .main, .selected, .workspace.open, .slotbar { grid-template-columns: 1fr; }
      .workspace { min-height: 0; }
      .tree { min-height: 620px; }

  </style>
</head>

  <div class="app">

        <h1>技能树工坊 · 独立演示页</h1>
        <p>不上线、不连接后端、不写入配置。用于多轮迭代 Agent 技能树交互与视觉。</p>
      </div>
      <div class="legend">
        <span class="chip"><i class="dot" style="background:var(--blue)"></i>通用技能</span>
        <span class="chip"><i class="dot" style="background:var(--teal)"></i>专业技能</span>
        <span class="chip"><i class="dot" style="background:#222937"></i>未来能力</span>
        <span class="chip"><i class="dot" style="background:var(--gold)"></i>需权限</span>
        <div class="config-tools">
          <label class="file-label">加载配置文件
            <input id="configFile" type="file" accept="application/json,.json" />
          </label>
          <span class="config-status" id="configStatus">配置：内置默认，旁路文件 skill-tree-workshop-config.json</span>
        </div>
      </div>
    </header>

    <section class="agents" id="agents"></section>

    <main class="main" id="previewMode">
      <section class="panel selected">
        <div class="profile">
          <h3 id="agentName"></h3>
          <div id="agentProfile"></div>
          <div class="full-toggle">
            <button class="btn primary" id="openTree">展开完整技能树</button>
            <button class="btn secondary" id="resetDraft">清空本地草稿</button>
          </div>
        </div>
        <div>
          <h3>技能树预览</h3>
          <div class="preview" id="previewTree"></div>
        </div>
      </section>
      <aside class="panel side">
        <h3>Roadmap 预览</h3>
        <div id="previewRoadmap"></div>
        <h3>新增规划节点</h3>
        <form class="plan-form" id="planForm">
          <input name="label" placeholder="节点简称，如：CI 诊断" required />
          <input name="skillName" placeholder="真实 skill 名称，如：github:gh-fix-ci" required />
          <textarea name="skillPath" placeholder="真实 SKILL.md 路径，如 E:\codeX\plugins\...\SKILL.md" required></textarea>
          <textarea name="description" placeholder="规划说明"></textarea>
          <div class="form-grid">
            <select name="branch" id="planBranch">
              <option value="generic">通用技能分支</option>
              <option value="professional">专业技能分支</option>
            </select>
            <select name="dependsOn" id="dependsOn"></select>
          </div>
          <button class="btn teal" type="submit">添加到技能树图谱</button>
        </form>
      </aside>
    </main>

    <section class="workspace" id="workspace">
      <div class="workspace-head">
        <div>
          <h2 id="workspaceTitle"></h2>
          <p id="workspaceSub"></p>
        </div>
        <button class="btn secondary" id="closeTree">收回到角色卡片</button>
      </div>
      <div class="tree" id="fullTree"></div>
      <aside class="inspector">
        <div class="inspector-card" id="inspector"></div>
        <div class="inspector-card">
          <h3>Roadmap</h3>
          <div id="roadmap"></div>
        </div>
      </aside>
      <div class="slotbar" id="slotbar"></div>
    </section>
  </div>

    function node(id, label, skillName, skillPath, category, branch, x, y, gear, description) {
      return { id, label, skillName, skillPath, category, branch, x, y, gear, description };
    }
    function $(id) { return document.getElementById(id); }
    function agents() { return (config || fallbackConfig).agents; }
    function currentAgent() { return agents().find(a => a.id === state.agentId) || agents()[0]; }
    function ensureDraft(a) {
      draft[a.id] ||= { plannedNodes: [] };
      draft[a.id].plannedNodes ||= [];
      return draft[a.id];
    }
    function plannedNodes(a) { return ensureDraft(a).plannedNodes; }
    function saveDraft() { localStorage.setItem(STORAGE_KEY, JSON.stringify(draft)); }
    function graphNodes(a) { return [...a.nodes, ...plannedNodes(a)]; }
    function graphEdges(a) {
      return [
        ...(a.edges || []),
        ...plannedNodes(a).flatMap(n => (n.dependsOn ? [[n.dependsOn, n.id]] : [])),
      ];
    }
    function firstNodeId(a = currentAgent()) { return graphNodes(a)[0]?.id || "model_base"; }
    function currentSkill() { return graphNodes(currentAgent()).find(s => s.id === state.skillId) || graphNodes(currentAgent())[0]; }
    function hasGear(a, s) { return (s.gear || []).every(g => a.tools.includes(g) || a.permissions.includes(g)); }
    function isPlannedNode(s) { return Boolean(s.userPlanned); }
    function pathToHref(path) { return path ? `file:///${path.replace(/\\/g, "/").replace(/^([A-Za-z]):/, "$1:")}` : "#"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function renderAgents() {
      $("agents").innerHTML = agents().map(a => `
        <button class="agent-card ${a.id === state.agentId ? "active" : ""}" data-agent="${a.id}" title="${escapeHtml(a.name)} · ${escapeHtml(a.title)}">
          <div class="agent-head"><div class="avatar" style="background:${a.accent}">${a.icon}</div><h2>${a.name}</h2></div>
        </button>`).join("");
    }

    function renderProfile() {
      const a = currentAgent();
      const stats = [
        ["真实节点", `${a.nodes.length}`],
        ["规划节点", `${plannedNodes(a).length}`],
        ["配置连线", `${graphEdges(a).length}`],
        ["工具数量", `${a.tools.length}`],
      ].map(([k, v]) => `<div class="overview-stat"><label>${k}</label><strong>${v}</strong></div>`).join("");
      const rows = [["定位", a.role], ["模型", a.model], ["Workspace", a.workspace], ["工具", a.tools.join(", ")], ["权限", a.permissions.join(", ")]]
        .map(([k, v]) => `<div class="profile-row"><label>${k}</label><span>${v}</span></div>`).join("");
      $("agentName").textContent = `${a.name} · ${a.title}`;
      $("agentProfile").innerHTML = `<div class="overview-grid">${stats}</div>${rows}`;
      $("workspaceTitle").textContent = `${a.name} · 完整技能树`;
      $("workspaceSub").textContent = `${a.role} · nodes/edges 来自配置文件；灰色规划节点来自本地草稿。`;
      renderDependsOptions();
    }

    function edgeStyle(from, to) {
      const x1 = from.x, y1 = from.y, x2 = to.x, y2 = to.y;
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;
      return `left:${x1}%;top:${y1}%;width:${len}%;transform:rotate(${angle}deg);`;
    }
    function renderTree(containerId, compact = false) {
      const a = currentAgent();
      const nodes = compact ? a.nodes.slice(0, 6) : graphNodes(a);
      const byId = new Map(graphNodes(a).map(s => [s.id, s]));
      const visible = new Set(nodes.map(s => s.id));
      const edges = graphEdges(a).map(([fromId, toId]) => [byId.get(fromId), byId.get(toId)]).filter(([from, to]) => from && to && visible.has(from.id) && visible.has(to.id));
      $(containerId).innerHTML = `
        ${compact ? "" : `<div class="pan-handle">抓手拖动视图</div><div class="branch-label left">通用技能</div><div class="branch-label right">专业技能</div>`}
        <div class="tree-canvas" style="${compact ? "" : `--pan-x:${state.panX}px;--pan-y:${state.panY}px;`}">
          ${compact ? "" : `<div class="divider"></div>`}
          ${edges.map(([from, to]) => `<i class="edge" style="${edgeStyle(from, to)}"></i>`).join("")}
          ${nodes.map(s => nodeHtml(a, s)).join("")}
        </div>`;
      $(containerId).querySelectorAll("[data-skill]").forEach(btn => btn.onclick = () => { state.skillId = btn.dataset.skill; renderAll(); });
      if (!compact) bindTreePan($(containerId));
    }
    function nodeHtml(a, s) {
      const cls = [isPlannedNode(s) ? "future planned" : ""].join(" ");
      const label = isPlannedNode(s) ? "用户规划" : (s.branch === "base" ? "基座" : "真实 skill");
      return `<div class="node ${cls}" style="left:${s.x}%;top:${s.y}%"><button data-skill="${s.id}"><span class="node-icon" style="background:${isPlannedNode(s) ? "#0f172a" : COLORS[s.category]}">${iconFor(s.category)}</span><span><strong>${escapeHtml(s.label)}</strong><small>${label}</small></span></button></div>`;
    }
    function iconFor(cat) { return ({ basic: "B", tool: "T", workflow: "W", permission: "P", quality: "Q", advanced: "A" })[cat] || "S"; }

    function bindTreePan(tree) {
      if (tree.dataset.panBound === "1") return;
      tree.dataset.panBound = "1";
      const drag = { active: false, pointerId: -1, x: 0, y: 0, ox: 0, oy: 0, moved: false };
      tree.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        if (event.target.closest("[data-skill]")) return;
        drag.active = true;
        drag.pointerId = event.pointerId;
        drag.x = event.clientX;
        drag.y = event.clientY;
        drag.ox = state.panX;
        drag.oy = state.panY;
        drag.moved = false;
        tree.classList.add("dragging");
        tree.setPointerCapture(event.pointerId);
      });
      tree.addEventListener("pointermove", event => {
        if (!drag.active || event.pointerId !== drag.pointerId) return;
        const dx = event.clientX - drag.x;
        const dy = event.clientY - drag.y;
        if (!drag.moved && Math.hypot(dx, dy) < 3) return;
        drag.moved = true;
        state.panX = drag.ox + dx;
        state.panY = drag.oy + dy;
        const canvas = tree.querySelector(".tree-canvas");
        if (canvas) {
          canvas.style.setProperty("--pan-x", `${state.panX}px`);
          canvas.style.setProperty("--pan-y", `${state.panY}px`);
        }
      });
      const end = event => {
        if (!drag.active || event.pointerId !== drag.pointerId) return;
        drag.active = false;
        tree.classList.remove("dragging");
        if (tree.hasPointerCapture(event.pointerId)) tree.releasePointerCapture(event.pointerId);
      };
      tree.addEventListener("pointerup", end);
      tree.addEventListener("pointercancel", end);
    }

    function renderRoadmaps() {
      const a = currentAgent();
      const items = plannedNodes(a);
      const html = items.length ? items.map(s => `<div class="roadmap-item"><div><strong>${escapeHtml(s.label)}</strong><span> ${escapeHtml(s.skillName)}</span></div><button class="btn secondary" data-remove="${s.id}">移除</button></div>`).join("") : `<div class="empty">还没有规划项。用“新增规划节点”表单添加后，灰色节点会出现在技能树图谱中。</div>`;
      $("previewRoadmap").innerHTML = html;
      $("roadmap").innerHTML = html;
      document.querySelectorAll("[data-remove]").forEach(btn => btn.onclick = () => {
        const arr = plannedNodes(a);
        const idx = arr.findIndex(s => s.id === btn.dataset.remove);
        if (idx >= 0) arr.splice(idx, 1);
        if (state.skillId === btn.dataset.remove) state.skillId = firstNodeId(a);
        saveDraft();
        renderAll();
      });
    }

    function renderDependsOptions() {
      const a = currentAgent();
      const branch = $("planBranch")?.value || "generic";
      const candidates = graphNodes(a).filter(s => s.branch === branch || s.branch === "base");
      $("dependsOn").innerHTML = candidates.map(s => `<option value="${s.id}">${escapeHtml(s.label)} (${s.id})</option>`).join("");
    }

    function renderInspector() {
      const a = currentAgent(), s = currentSkill();
      const missing = (s.gear || []).filter(g => !a.tools.includes(g) && !a.permissions.includes(g));
      const deps = graphEdges(a).filter(([, to]) => to === s.id).map(([from]) => from);
      $("inspector").innerHTML = `
        <h3>${escapeHtml(s.label)}</h3>
        <p style="margin:0 0 10px;color:var(--muted);font-size:12px">${escapeHtml(s.description)}</p>
        <div class="meta-grid">
          <div class="slot"><strong>分支</strong><span>${s.branch}</span></div>
          <div class="slot"><strong>类别</strong><span>${s.category}</span></div>
          <div class="slot"><strong>依赖</strong><span>${deps.join(", ") || "无"}</span></div>
          <div class="slot"><strong>装备</strong><span>${(s.gear || []).join(", ") || "无"}</span></div>
        </div>
        ${s.nodeType === "model"
          ? `<div class="slot" style="margin-top:8px"><strong>模型基座</strong><span>${escapeHtml(s.model || currentAgent().model)} · 不对应 SKILL.md</span></div>`
          : `<div class="slot" style="margin-top:8px"><strong>真实 Skill</strong><span>${escapeHtml(s.skillName)} · ${escapeHtml(s.skillRuntime || "unknown")}</span><a class="real-skill-link" href="${pathToHref(s.skillPath)}" target="_blank">${escapeHtml(s.skillPath)}</a></div>`}
        ${missing.length ? `<p style="color:var(--red);font-size:12px">缺少工具/权限：${missing.join(", ")}</p>` : ""}
        <div class="full-toggle">
          <button class="btn teal" id="removePlanBtn" ${!isPlannedNode(s) ? "disabled" : ""}>移除规划节点</button>
        </div>`;
      $("removePlanBtn").onclick = () => {
        if (!isPlannedNode(s)) return;
        const arr = plannedNodes(a);
        const idx = arr.findIndex(n => n.id === s.id);
        if (idx >= 0) arr.splice(idx, 1);
        state.skillId = firstNodeId(a);
        saveDraft();
        renderAll();
      };
    }

    function renderSlotbar() {
      const a = currentAgent();
      const slots = [["模型槽", a.model], ["Workspace", a.workspace], ["工具槽", a.tools.join(", ")], ["权限槽", a.permissions.join(", ")], ["图谱来源", "skill-tree-workshop-config.json"]];
      $("slotbar").innerHTML = slots.map(([k, v]) => `<div class="slot"><strong>${k}</strong><span>${v}</span></div>`).join("");
    }

    function addPlanNode(form) {
      const a = currentAgent();
      const arr = plannedNodes(a);
      const count = arr.length;
      const id = `plan_${Date.now().toString(36)}`;
      const branch = form.branch.value || "generic";
      const dependsOn = form.dependsOn.value || firstNodeId(a);
      const node = {
        id,
        label: form.label.value.trim(),
        nodeType: "skill",
        skillName: form.skillName.value.trim(),
        skillRuntime: "planned",
        skillPath: form.skillPath.value.trim(),
        description: form.description.value.trim() || "用户自行规划的未来能力。",
        category: branch === "generic" ? "workflow" : "advanced",
        branch,
        x: branch === "generic" ? 26 : 74,
        y: Math.min(88, 66 + count * 10),
        gear: [],
        dependsOn,
        userPlanned: true
      };
      arr.push(node);
      state.skillId = id;
      saveDraft();
      form.reset();
      renderAll();
      openFull();
    }

    function normalizeConfig(input) {
      if (input?.agent && Array.isArray(input.nodes) && Array.isArray(input.edges)) {
        return {
          version: input.version || 2,
          agents: [{
            ...input.agent,
            nodes: input.nodes,
            edges: input.edges,
            futureAnchors: input.futureAnchors || [],
          }],
          singleAgent: true,
        };
      }
      if (Array.isArray(input?.agents)) return { ...input, singleAgent: false };
      if (Array.isArray(input?.agentConfigs)) {
        throw new Error("这是 manifest 索引文件；请加载 skill-tree-configs/agent-*.skill-tree.json 单个 Agent 配置。");
      }
      throw new Error("配置文件应为单个 Agent skill-tree JSON，或包含 agents 数组。");
    }

    function validateConfig(nextConfig) {
      for (const agent of nextConfig.agents) {
        if (!Array.isArray(agent.nodes) || !Array.isArray(agent.edges)) {
          throw new Error(`Agent ${agent.id || agent.name} 缺少 nodes 或 edges`);
        }
        for (const item of agent.nodes) {
          if (!item.id || !item.label) {
            throw new Error(`Agent ${agent.id} 存在缺少 id/label 的节点`);
          }
          if (item.nodeType !== "model" && (!item.skillPath || !item.skillName)) {
            throw new Error(`Agent ${agent.id} 存在未绑定真实 SKILL.md 的节点`);
          }
        }
      }
    }

    function applyConfig(rawConfig, label) {
      const nextConfig = normalizeConfig(rawConfig);
      validateConfig(nextConfig);
      if (nextConfig.singleAgent) {
        const base = config || fallbackConfig;
        const incoming = nextConfig.agents[0];
        const exists = base.agents.some(agent => agent.id === incoming.id);
        config = {
          version: base.version || 2,
          agents: exists
            ? base.agents.map(agent => agent.id === incoming.id ? incoming : agent)
            : [...base.agents, incoming],
        };
        state.agentId = incoming.id;
      } else {
        config = nextConfig;
      }
      if (!agents().some(a => a.id === state.agentId)) state.agentId = agents()[0].id;
      state.skillId = graphNodes(currentAgent())[0]?.id || "model_base";
      $("configStatus").textContent = `配置：${label} · ${agents().length} agents`;
      renderAll();
    }

    async function loadManifest(manifest) {
      if (!Array.isArray(manifest?.agentConfigs)) {
        throw new Error("manifest 缺少 agentConfigs");
      }
      const loaded = [];
      for (const item of manifest.agentConfigs) {
        const res = await fetch(item.configPath, { cache: "no-store" });
        if (!res.ok) throw new Error(`${item.configPath}: ${res.status} ${res.statusText}`);
        const single = normalizeConfig(await res.json());
        loaded.push(single.agents[0]);
      }
      applyConfig({ version: manifest.version || 2, agents: loaded }, "manifest + independent agent configs");
    }

    async function loadDefaultConfig() {
      if (location.protocol === "file:") {
        config = fallbackConfig;
        $("configStatus").textContent = "配置：内置默认，已按独立 Agent 配置同步。file:// 下可手动加载 agent-*.skill-tree.json。";
        renderAll();
        return;
      }
      try {
        const res = await fetch("./skill-tree-workshop-config.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        const loaded = await res.json();
        if (Array.isArray(loaded.agentConfigs)) await loadManifest(loaded);
        else applyConfig(loaded, "skill-tree-workshop-config.json");
      } catch (error) {
        config = fallbackConfig;
        $("configStatus").textContent = "配置：内置默认。自动读取独立配置失败，可点“加载配置文件”手动选择。";
        renderAll();
      }
    }

    function openFull() { state.full = true; $("previewMode").classList.add("hide"); $("workspace").classList.add("open"); renderAll(); }
    function closeFull() { state.full = false; $("workspace").classList.remove("open"); $("previewMode").classList.remove("hide"); renderAll(); }
    function renderAll() {
      renderAgents(); renderProfile(); renderTree("previewTree", true); renderRoadmaps();
      if (state.full) { renderTree("fullTree"); renderInspector(); renderSlotbar(); }
    }

    $("agents").onclick = e => {
      const card = e.target.closest("[data-agent]");
      if (!card) return;
      state.agentId = card.dataset.agent;
      state.skillId = firstNodeId(currentAgent());
      state.panX = 0;
      state.panY = 0;
      renderAll();
    };
    $("openTree").onclick = openFull;
    $("closeTree").onclick = closeFull;
    $("resetDraft").onclick = () => { localStorage.removeItem(STORAGE_KEY); Object.keys(draft).forEach(k => delete draft[k]); renderAll(); };
    $("planForm").onsubmit = event => { event.preventDefault(); addPlanNode(event.currentTarget); };
    $("planBranch").onchange = () => renderDependsOptions();
    $("configFile").onchange = async event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        applyConfig(JSON.parse(await file.text()), file.name);
      } catch (error) {
        $("configStatus").textContent = `配置加载失败：${error.message}`;
      }
    };
    loadDefaultConfig();
  </script>
</body>
</html>
